name: Build and Release

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi push tag có dạng v1.0.0, v1.0.1...

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          # Build app chính (--onedir để dễ cập nhật)
          pyinstaller --noconfirm --clean --windowed --name CryptoBot main.py
          
          # Build updater
          pyinstaller --noconfirm --clean --onefile --windowed --name CryptoBotUpdater updater.py

      - name: Prepare Release Package
        run: |
          # Copy updater vào thư mục build của app chính
          Copy-Item "dist/CryptoBotUpdater.exe" -Destination "dist/CryptoBot/"
          # Copy file version.txt
          Copy-Item "version.txt" -Destination "dist/CryptoBot/"
          # Nén toàn bộ thư mục CryptoBot thành file zip
          Compress-Archive -Path "dist/CryptoBot/*" -DestinationPath "CryptoBot-Release.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: CryptoBot-Release.zip
          generate_release_notes: true
          draft: false
          prerelease: false